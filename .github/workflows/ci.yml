name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Зависимости
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Тесты
        run: python -m pytest -q tests
      - name: Сквозная проверка (окно + подставной API)
        shell: pwsh
        run: |
          $fake = Start-Process python -ArgumentList "tests/fake_finam.py","18799" -PassThru -NoNewWindow
          $env:BR_FINAM_API = "http://127.0.0.1:18799"
          $env:BR_POLL_S = "0.05"
          $app = Start-Process python -ArgumentList "app.py","--port","18765","--no-browser","--data","$env:RUNNER_TEMP\br-e2e" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { try { Invoke-WebRequest http://127.0.0.1:18765/health -UseBasicParsing | Out-Null; $ok = $true; break } catch { Start-Sleep 1 } }
          if (-not $ok) { throw "окно не поднялось" }
          python tests/e2e_check.py http://127.0.0.1:18765 --api
          $code = $LASTEXITCODE
          Stop-Process -Id $app.Id, $fake.Id -Force
          exit $code
