name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег существующей версии (например v1.0.4)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Версия в коде = тег
        shell: pwsh
        run: |
          $v = python -c "import app; print(app.VERSION)"
          if ("v$v" -ne $env:TAG) { throw "VERSION в app.py ($v) не совпадает с тегом $env:TAG" }
          "VER=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Тесты
        run: python -m pytest -q tests
      - name: Сборка
        run: python build.py
      - name: Сквозная проверка собранного exe
        shell: pwsh
        run: |
          Expand-Archive "dist/BrokerReport-$env:VER-win64.zip" "$env:RUNNER_TEMP/rel"
          $fake = Start-Process python -ArgumentList "tests/fake_finam.py","18799" -PassThru -NoNewWindow
          $env:BR_FINAM_API = "http://127.0.0.1:18799"
          $env:BR_POLL_S = "0.05"
          $exe = Start-Process "$env:RUNNER_TEMP/rel/BrokerReport/BrokerReport.exe" -ArgumentList "--port","18766","--no-browser","--data","$env:RUNNER_TEMP\br-rel" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) { try { Invoke-WebRequest http://127.0.0.1:18766/health -UseBasicParsing | Out-Null; $ok = $true; break } catch { Start-Sleep 1 } }
          if (-not $ok) { throw "exe не поднялся" }
          python tests/e2e_check.py http://127.0.0.1:18766 --api
          $code = $LASTEXITCODE
          Stop-Process -Id $exe.Id, $fake.Id -Force
          exit $code
      - name: Контрольные суммы
        shell: pwsh
        run: |
          $z = "dist/BrokerReport-$env:VER-win64.zip"
          $h = (Get-FileHash $z -Algorithm SHA256).Hash.ToLower()
          "$h  BrokerReport-$env:VER-win64.zip" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - name: Заметки к релизу из CHANGELOG
        shell: pwsh
        run: |
          $t = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($t, "(?s)## \[$([regex]::Escape($env:VER))\][^\n]*\n(.*?)(?=\n## \[|\n\[\d)")
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "См. CHANGELOG.md" }
          $body + "`n`n**Проверка архива:** сверьте SHA-256 с файлом SHA256SUMS.txt (PowerShell: ``Get-FileHash``)." | Out-File -Encoding utf8 dist/NOTES.md
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG "dist/BrokerReport-$env:VER-win64.zip" dist/SHA256SUMS.txt --clobber
          } else {
            gh release create $env:TAG "dist/BrokerReport-$env:VER-win64.zip" dist/SHA256SUMS.txt --title "BrokerReport $env:VER" --notes-file dist/NOTES.md
          }
